<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Calendar — Vilona Admin</title>
  <style>
    :root { --bg:#0d0d14; --card:#1a1a24; --border:#2a2a3a; --gold:#c4a35a; --text:#e0e0f0; --muted:#888899; --green:#4ade80; --red:#f87171; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); padding:24px; }
    h1 { font-size:22px; font-weight:700; margin-bottom:20px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; border:none; }
    .btn-gold { background:var(--gold); color:#0d0d14; }
    .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--border); }
    .btn-danger { background:#3a0f0f; color:var(--red); border:1px solid #5a1f1f; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); font-size:13px; }
    th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.5px; }
    .badge { display:inline-block; padding:2px 8px; border-radius:9999px; font-size:11px; font-weight:600; }
    .badge-green { background:#0f3020; color:var(--green); }
    .badge-yellow { background:#3a2a0a; color:#fbbf24; }
    .badge-red { background:#3a0f0f; color:var(--red); }
    .badge-blue { background:#0f2040; color:#60a5fa; }
    .empty { text-align:center; padding:40px; color:var(--muted); }
    .actions { display:flex; gap:8px; margin-bottom:16px; }
    .input { background:#0d0d14; border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:8px; font-size:13px; outline:none; width:100%; }
    .input:focus { border-color:var(--gold); }
    .form-row { display:flex; gap:12px; margin-bottom:12px; }
    .form-row > * { flex:1; }
    .form-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:4px; }
    #toast { position:fixed; bottom:24px; right:24px; padding:12px 18px; border-radius:10px; font-size:13px; z-index:100; display:none; }
    .toast-ok { background:#0f3020; color:var(--green); border:1px solid #1a5030; }
    .toast-err { background:#3a0f0f; color:var(--red); border:1px solid #5a1f1f; }
  </style>
</head>
<body>
  <h1>📅 Content Calendar</h1>

  <div class="actions">
    <button class="btn btn-gold" onclick="showScheduleForm()">➕ Schedule Content</button>
    <button class="btn btn-ghost" onclick="loadEntries()">🔄 Refresh</button>
  </div>

  <!-- Schedule Form -->
  <div id="schedule-form" class="card" style="display:none;">
    <h3 style="margin-bottom:16px;">Schedule New Content</h3>
    <div class="form-row">
      <div><span class="form-label">Topic</span><input class="input" id="cal-topic" placeholder="Tips coding untuk pemula"></div>
    </div>
    <div class="form-row">
      <div><span class="form-label">Date & Time</span><input class="input" id="cal-datetime" type="datetime-local"></div>
      <div><span class="form-label">Platform</span>
        <select class="input" id="cal-platform"><option value="tiktok">TikTok</option><option value="instagram">Instagram</option><option value="youtube">YouTube</option></select>
      </div>
    </div>
    <div class="form-row">
      <div><span class="form-label">Content Type</span>
        <select class="input" id="cal-type"><option value="video">Video</option><option value="carousel">Carousel</option><option value="remeta">Re-Metadata</option></select>
      </div>
      <div><span class="form-label">Niche</span><input class="input" id="cal-niche" placeholder="tech tips"></div>
    </div>
    <div class="form-row">
      <div><span class="form-label">Style</span>
        <select class="input" id="cal-style"><option value="educational">Educational</option><option value="viral">Viral</option><option value="storytelling">Storytelling</option><option value="minimal">Minimal</option></select>
      </div>
      <div><span class="form-label">Auto Post?</span>
        <select class="input" id="cal-autopost"><option value="false">No (Manual)</option><option value="true">Yes (Auto)</option></select>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-gold" onclick="scheduleContent()">📅 Schedule</button>
      <button class="btn btn-ghost" onclick="document.getElementById('schedule-form').style.display='none'">Cancel</button>
    </div>
  </div>

  <!-- Calendar Table -->
  <div class="card">
    <table>
      <thead><tr><th>Topic</th><th>Platform</th><th>Type</th><th>Scheduled</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="cal-table"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody>
    </table>
  </div>

  <!-- Stats -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
    <div class="card" style="text-align:center;"><div style="font-size:11px;color:var(--muted);">TOTAL</div><div style="font-size:24px;font-weight:700;" id="stat-total">—</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:11px;color:var(--muted);">SCHEDULED</div><div style="font-size:24px;font-weight:700;color:#fbbf24;" id="stat-scheduled">—</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:11px;color:var(--muted);">PUBLISHED</div><div style="font-size:24px;font-weight:700;color:var(--green);" id="stat-published">—</div></div>
    <div class="card" style="text-align:center;"><div style="font-size:11px;color:var(--muted);">FAILED</div><div style="font-size:24px;font-weight:700;color:var(--red);" id="stat-failed">—</div></div>
  </div>

  <div id="toast"></div>

  <script>
    const API = '/api/py';

    function showToast(msg, type='ok') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast-' + type;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    function showScheduleForm() {
      document.getElementById('schedule-form').style.display = 'block';
    }

    async function loadEntries() {
      try {
        const r = await fetch(`${API}/calendar/list/0`);
        const data = await r.json();
        const entries = data.entries || [];
        const tbody = document.getElementById('cal-table');

        if (!entries.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="empty">No scheduled content. Click ➕ to add.</td></tr>';
        } else {
          tbody.innerHTML = entries.map(e => {
            const statusBadge = {
              scheduled: 'badge-yellow',
              generating: 'badge-blue',
              published: 'badge-green',
              failed: 'badge-red',
            }[e.status] || 'badge-yellow';
            const emoji = e.content_type === 'carousel' ? '🖼️' : e.content_type === 'remeta' ? '🔄' : '🎬';
            return `<tr>
              <td>${emoji} ${e.topic}</td>
              <td>${e.platform}</td>
              <td>${e.content_type}</td>
              <td>${e.scheduled_at}</td>
              <td><span class="badge ${statusBadge}">${e.status}</span></td>
              <td><button class="btn btn-danger" style="padding:4px 8px;font-size:11px;" onclick="deleteEntry('${e.id}')">🗑️</button></td>
            </tr>`;
          }).join('');
        }

        // Stats
        const total = entries.length;
        const scheduled = entries.filter(e => e.status === 'scheduled').length;
        const published = entries.filter(e => e.status === 'published').length;
        const failed = entries.filter(e => e.status === 'failed').length;
        document.getElementById('stat-total').textContent = total;
        document.getElementById('stat-scheduled').textContent = scheduled;
        document.getElementById('stat-published').textContent = published;
        document.getElementById('stat-failed').textContent = failed;
      } catch (e) {
        document.getElementById('cal-table').innerHTML = '<tr><td colspan="6" class="empty">Error loading calendar</td></tr>';
      }
    }

    async function scheduleContent() {
      const topic = document.getElementById('cal-topic').value.trim();
      const datetime = document.getElementById('cal-datetime').value;
      const platform = document.getElementById('cal-platform').value;
      const contentType = document.getElementById('cal-type').value;
      const niche = document.getElementById('cal-niche').value.trim();
      const style = document.getElementById('cal-style').value;
      const autoPost = document.getElementById('cal-autopost').value === 'true';

      if (!topic) return showToast('Enter a topic', 'err');
      if (!datetime) return showToast('Select date & time', 'err');

      try {
        const r = await fetch(`${API}/calendar/schedule`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: 0,
            topic,
            scheduled_at: datetime.replace('T', ' '),
            platform,
            content_type: contentType,
            niche,
            style,
            auto_post: autoPost,
          }),
        });
        const data = await r.json();
        if (data.id) {
          showToast('✅ Content scheduled!');
          document.getElementById('schedule-form').style.display = 'none';
          document.getElementById('cal-topic').value = '';
          loadEntries();
        } else {
          showToast('❌ ' + (data.error || 'Failed'), 'err');
        }
      } catch (e) {
        showToast('❌ ' + e.message, 'err');
      }
    }

    async function deleteEntry(id) {
      if (!confirm('Delete this entry?')) return;
      try {
        await fetch(`${API}/calendar/delete/${id}`, { method: 'DELETE' });
        showToast('🗑️ Deleted');
        loadEntries();
      } catch (e) {
        showToast('❌ ' + e.message, 'err');
      }
    }

    loadEntries();
  </script>
</body>
</html>
