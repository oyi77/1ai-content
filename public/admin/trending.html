<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trending Scanner — Vilona Admin</title>
  <style>
    :root { --bg:#0d0d14; --card:#1a1a24; --border:#2a2a3a; --gold:#c4a35a; --text:#e0e0f0; --muted:#888899; --green:#4ade80; --red:#f87171; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); padding:24px; }
    h1 { font-size:22px; font-weight:700; margin-bottom:20px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; border:none; }
    .btn-gold { background:var(--gold); color:#0d0d14; }
    .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--border); }
    .badge { display:inline-block; padding:2px 8px; border-radius:9999px; font-size:11px; font-weight:600; }
    .badge-yt { background:#3a0f0f; color:#f87171; }
    .badge-google { background:#0f2040; color:#60a5fa; }
    .badge-reddit { background:#3a2a0a; color:#fbbf24; }
    .badge-tiktok { background:#0f3020; color:#4ade80; }
    .list-item { display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid var(--border); }
    .list-item:last-child { border-bottom:none; }
    .list-item .title { font-size:14px; font-weight:600; }
    .list-item .meta { font-size:11px; color:var(--muted); margin-top:2px; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
    .stat { text-align:center; }
    .stat .num { font-size:28px; font-weight:700; }
    .stat .label { font-size:11px; color:var(--muted); }
  </style>
</head>
<body>
  <h1>🔥 Trending Scanner</h1>

  <div class="stats">
    <div class="card stat"><div class="num" id="s-yt">—</div><div class="label">YouTube</div></div>
    <div class="card stat"><div class="num" id="s-google">—</div><div class="label">Google Trends</div></div>
    <div class="card stat"><div class="num" id="s-reddit">—</div><div class="label">Reddit</div></div>
    <div class="card stat"><div class="num" id="s-tiktok">—</div><div class="label">TikTok</div></div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:16px;">
    <button class="btn btn-gold" onclick="scanTrending()">🔥 Scan Now</button>
    <button class="btn btn-ghost" onclick="loadCached()">📂 Load Cached</button>
  </div>

  <div class="card">
    <div id="results"><div style="text-align:center;padding:40px;color:var(--muted);">Click 🔥 Scan Now to fetch trending topics</div></div>
  </div>

  <script>
    const API = '/api/py';

    async function scanTrending() {
      document.getElementById('results').innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);">⏳ Scanning YouTube, Google Trends, Reddit, TikTok...</div>';
      try {
        const r = await fetch(`${API}/trending/scan`);
        const data = await r.json();
        renderResults(data);
      } catch (e) {
        document.getElementById('results').innerHTML = `<div style="text-align:center;padding:40px;color:var(--red);">❌ ${e.message}</div>`;
      }
    }

    async function loadCached() {
      try {
        const r = await fetch(`${API}/trending/scan`);
        const data = await r.json();
        renderResults(data);
      } catch (e) {
        document.getElementById('results').innerHTML = `<div style="text-align:center;padding:40px;color:var(--red);">❌ ${e.message}</div>`;
      }
    }

    function renderResults(data) {
      const yt = data.youtube || [];
      const google = data.google || [];
      const reddit = data.reddit || [];
      const tiktok = data.tiktok || [];

      document.getElementById('s-yt').textContent = yt.length;
      document.getElementById('s-google').textContent = google.length;
      document.getElementById('s-reddit').textContent = reddit.length;
      document.getElementById('s-tiktok').textContent = tiktok.length;

      let html = '';

      if (yt.length) {
        html += '<h3 style="margin:16px 0 8px;">📺 YouTube Trending</h3>';
        yt.slice(0, 10).forEach((v, i) => {
          html += `<div class="list-item">
            <span style="font-size:18px;font-weight:700;color:var(--muted);">${i+1}</span>
            <div>
              <div class="title">${v.title || 'Untitled'}</div>
              <div class="meta">${v.channel || ''} · ${v.views ? (v.views/1000).toFixed(0)+'K views' : ''} · <span class="badge badge-yt">YouTube</span></div>
            </div>
          </div>`;
        });
      }

      if (google.length) {
        html += '<h3 style="margin:16px 0 8px;">🔍 Google Trends</h3>';
        google.slice(0, 10).forEach((t, i) => {
          html += `<div class="list-item">
            <span style="font-size:18px;font-weight:700;color:var(--muted);">${i+1}</span>
            <div>
              <div class="title">${t.title || ''}</div>
              <div class="meta">${t.traffic || 'N/A'} searches · <span class="badge badge-google">Google</span></div>
            </div>
          </div>`;
        });
      }

      if (reddit.length) {
        html += '<h3 style="margin:16px 0 8px;">👽 Reddit Hot</h3>';
        reddit.slice(0, 10).forEach((p, i) => {
          html += `<div class="list-item">
            <span style="font-size:18px;font-weight:700;color:var(--muted);">${i+1}</span>
            <div>
              <div class="title">${p.title || ''}</div>
              <div class="meta">r/${p.subreddit || ''} · ${p.score || 0}↑ · ${p.comments || 0}💬 · <span class="badge badge-reddit">Reddit</span></div>
            </div>
          </div>`;
        });
      }

      if (tiktok.length) {
        html += '<h3 style="margin:16px 0 8px;">🎵 TikTok Trending</h3>';
        tiktok.slice(0, 10).forEach((t, i) => {
          html += `<div class="list-item">
            <span style="font-size:18px;font-weight:700;color:var(--muted);">${i+1}</span>
            <div>
              <div class="title">${t.title || ''}</div>
              <div class="meta">${t.views ? (t.views/1000).toFixed(0)+'K views' : ''} · <span class="badge badge-tiktok">TikTok</span></div>
            </div>
          </div>`;
        });
      }

      if (!html) {
        html = '<div style="text-align:center;padding:40px;color:var(--muted);">No trending data found. Try again later.</div>';
      }

      document.getElementById('results').innerHTML = html;
    }

    loadCached();
  </script>
</body>
</html>
